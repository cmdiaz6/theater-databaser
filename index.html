<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theater Databaser</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .star-hover:hover ~ svg { color: #9ca3af; }
        .dark .star-hover:hover ~ svg { color: #4b5563; }
        .star-hover:hover { color: #fbbf24; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-200 min-h-screen pb-12 flex flex-col transition-colors duration-200 selection:bg-indigo-500 selection:text-white">

    <!-- Navigation -->
    <nav class="bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 sticky top-0 z-10 transition-colors duration-200">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 flex-wrap">
                <div class="flex items-center space-x-2">
                    <svg class="w-6 h-6 text-indigo-600 dark:text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"></path></svg>
                    <span class="font-bold text-xl tracking-tight hidden sm:inline text-gray-900 dark:text-white">Theater Databaser</span>
                </div>
                <div class="flex items-center space-x-1 sm:space-x-2">
                    <button onclick="app.switchTab('rate')" id="nav-rate" class="px-3 py-2 rounded-md text-sm font-medium transition-colors bg-indigo-600 text-white shadow-inner">Rate</button>
                    <button onclick="app.switchTab('browse')" id="nav-browse" class="px-3 py-2 rounded-md text-sm font-medium transition-colors text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-white">Browse</button>
                    <div class="w-px h-6 bg-gray-300 dark:bg-gray-700 mx-2"></div>
                    <button onclick="app.toggleTheme()" class="p-2 rounded-md text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors" title="Toggle Light/Dark Mode">
                        <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                        <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="max-w-4xl mx-auto w-full px-4 sm:px-6 mt-6 flex-1">
        
        <div id="notification" class="hidden fixed top-20 left-1/2 transform -translate-x-1/2 z-50 px-4 py-3 rounded-lg shadow-lg text-sm font-semibold text-white transition-all duration-300"></div>

        <!-- RATE VIEW -->
        <main id="view-rate" class="block space-y-6 animate-fade-in">
            <div class="bg-white dark:bg-gray-900 rounded-2xl shadow-xl border border-gray-200 dark:border-gray-800 overflow-hidden transition-colors duration-200">
                <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-900/50 flex justify-between items-center transition-colors duration-200">
                    <div>
                        <h2 class="text-lg font-bold text-gray-900 dark:text-gray-100">Add Rating</h2>
                        <p class="text-xs text-gray-500 dark:text-gray-400">Record your theater experience globally</p>
                    </div>
                </div>
                
                <form id="rating-form" class="p-6 space-y-5" onsubmit="app.submitRating(event)">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div class="sm:col-span-2">
                            <label for="rate-cineplex" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Cineplex</label>
                            <div class="flex space-x-2">
                                <select id="rate-cineplex" required onchange="app.updateTheaterDatalist()" class="flex-1 block w-full rounded-lg border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-200 border p-2.5 focus:border-indigo-500 focus:ring-indigo-500 text-sm shadow-sm transition-colors duration-200">
                                    <option value="" disabled selected>Loading...</option>
                                </select>
                                <button type="button" onclick="app.openModal('add-modal')" class="inline-flex items-center px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-lg shadow-sm text-sm font-medium text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none transition-colors whitespace-nowrap">
                                    + New
                                </button>
                            </div>
                        </div>

                        <div>
                            <label for="theater-number" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Theater / Screen</label>
                            <input type="text" id="theater-number" required list="theater-suggestions" placeholder="e.g. 12, IMAX" class="block w-full rounded-lg border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-200 placeholder-gray-400 dark:placeholder-gray-500 border p-2.5 focus:border-indigo-500 focus:ring-indigo-500 text-sm shadow-sm transition-colors duration-200">
                            <datalist id="theater-suggestions"></datalist>
                        </div>
                        
                        <div>
                            <label for="seat-number" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Seat <span class="text-gray-400 dark:text-gray-500 font-normal">(Optional)</span></label>
                            <input type="text" id="seat-number" placeholder="e.g. G14" class="block w-full rounded-lg border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-200 placeholder-gray-400 dark:placeholder-gray-500 border p-2.5 focus:border-indigo-500 focus:ring-indigo-500 text-sm shadow-sm transition-colors duration-200">
                        </div>
                    </div>

                    <div>
                        <label for="author-name" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Your Name</label>
                        <input type="text" id="author-name" required placeholder="Author" class="block w-full rounded-lg border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-200 placeholder-gray-400 dark:placeholder-gray-500 border p-2.5 focus:border-indigo-500 focus:ring-indigo-500 text-sm shadow-sm transition-colors duration-200">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Rating <span class="text-gray-400 dark:text-gray-500 font-normal">(Optional)</span></label>
                        <div class="flex items-center space-x-1" id="star-selector"></div>
                    </div>

                    <div>
                        <label for="review-text" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Review Details</label>
                        <textarea id="review-text" rows="3" required placeholder="Thoughts on projection, sound, seating..." class="block w-full rounded-lg border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-200 placeholder-gray-400 dark:placeholder-gray-500 border p-2.5 focus:border-indigo-500 focus:ring-indigo-500 text-sm shadow-sm transition-colors duration-200"></textarea>
                    </div>

                    <div class="pt-2">
                        <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-md text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                            Save Rating Globally
                        </button>
                    </div>
                </form>
            </div>
        </main>

        <!-- BROWSE VIEW -->
        <main id="view-browse" class="hidden space-y-5">
            <div class="bg-white dark:bg-gray-900 rounded-2xl shadow-xl border border-gray-200 dark:border-gray-800 p-5 transition-colors duration-200">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label for="browse-cineplex" class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1">Cineplex</label>
                        <select id="browse-cineplex" onchange="app.onBrowseCineplexChange()" class="block w-full rounded-lg border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-200 border p-2 focus:border-indigo-500 focus:ring-indigo-500 text-sm shadow-sm transition-colors duration-200"></select>
                    </div>
                    <div>
                        <label for="browse-theater" class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1">Theater Screen</label>
                        <select id="browse-theater" onchange="app.renderBrowseList()" disabled class="block w-full rounded-lg border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-200 border p-2 focus:border-indigo-500 focus:ring-indigo-500 text-sm shadow-sm disabled:opacity-40 transition-colors duration-200">
                            <option value="all">All Theaters</option>
                        </select>
                    </div>
                    <div>
                        <label for="browse-author" class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1">Filter by Author</label>
                        <select id="browse-author" onchange="app.renderBrowseList()" class="block w-full rounded-lg border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-200 border p-2 focus:border-indigo-500 focus:ring-indigo-500 text-sm shadow-sm transition-colors duration-200">
                            <option value="all">All Authors</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="browse-content" class="space-y-6">
                <div class="text-center p-10 text-gray-500">Loading live data...</div>
            </div>
        </main>
    </div>

    <!-- ADD CINEPLEX MODAL -->
    <div id="add-modal" class="fixed inset-0 z-50 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-900/50 dark:bg-gray-950/80 transition-opacity backdrop-blur-sm" aria-hidden="true" onclick="app.closeModal('add-modal')"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div class="inline-block align-bottom bg-white dark:bg-gray-900 rounded-2xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-md sm:w-full border border-gray-200 dark:border-gray-700">
                <form onsubmit="app.submitNewCineplex(event)">
                    <div class="px-6 pt-6 pb-4">
                        <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-1">New Cineplex</h3>
                        <p class="text-sm text-gray-500 dark:text-gray-400 mb-5">Add a new location to the global database.</p>
                        <div class="space-y-4">
                            <div>
                                <label for="new-cineplex-name" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Name</label>
                                <input type="text" id="new-cineplex-name" required placeholder="e.g. AMC Grand 24" class="block w-full rounded-lg border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-200 placeholder-gray-400 dark:placeholder-gray-500 border p-2.5 focus:border-indigo-500 focus:ring-indigo-500 text-sm">
                            </div>
                            <div>
                                <label for="new-cineplex-address" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Address / Notes (Optional)</label>
                                <input type="text" id="new-cineplex-address" placeholder="e.g. 123 Main St, City" class="block w-full rounded-lg border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-200 placeholder-gray-400 dark:placeholder-gray-500 border p-2.5 focus:border-indigo-500 focus:ring-indigo-500 text-sm">
                            </div>
                        </div>
                    </div>
                    <div class="bg-gray-50 dark:bg-gray-800 px-6 py-4 sm:flex sm:flex-row-reverse border-t border-gray-200 dark:border-gray-700">
                        <button type="submit" class="w-full inline-flex justify-center rounded-lg border border-transparent shadow-sm px-4 py-2.5 bg-indigo-600 text-sm font-bold text-white hover:bg-indigo-500 focus:outline-none sm:ml-3 sm:w-auto transition-colors">Add Cineplex</button>
                        <button type="button" onclick="app.closeModal('add-modal')" class="mt-3 w-full inline-flex justify-center rounded-lg border border-gray-300 dark:border-gray-600 shadow-sm px-4 py-2.5 bg-white dark:bg-gray-700 text-sm font-bold text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600 focus:outline-none transition-colors sm:mt-0 sm:ml-3 sm:w-auto">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- AUTHENTICATION (PASSWORD) MODAL -->
    <div id="auth-modal" class="fixed inset-0 z-50 hidden" aria-labelledby="auth-title" role="dialog" aria-modal="true">
        <div class="flex items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-900/50 dark:bg-gray-950/80 transition-opacity backdrop-blur-sm" aria-hidden="true" onclick="app.closeModal('auth-modal')"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div class="inline-block align-bottom bg-white dark:bg-gray-900 rounded-2xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-sm sm:w-full border border-gray-200 dark:border-gray-700">
                <form onsubmit="app.submitAuth(event)">
                    <div class="px-6 pt-6 pb-4">
                        <h3 class="text-lg font-bold text-gray-900 dark:text-white mb-2 flex items-center" id="auth-title">
                            <svg class="w-5 h-5 text-indigo-500 dark:text-indigo-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                            Authentication Required
                        </h3>
                        <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">Enter password to edit or delete this globally.</p>
                        <div>
                            <input type="password" id="auth-password" required placeholder="Password" class="block w-full rounded-lg border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-200 border p-2.5 focus:border-indigo-500 focus:ring-indigo-500 text-sm">
                        </div>
                    </div>
                    <div class="bg-gray-50 dark:bg-gray-800 px-6 py-4 sm:flex sm:flex-row-reverse border-t border-gray-200 dark:border-gray-700">
                        <button type="submit" class="w-full inline-flex justify-center rounded-lg border border-transparent shadow-sm px-4 py-2 bg-indigo-600 text-sm font-bold text-white hover:bg-indigo-500 focus:outline-none sm:ml-3 sm:w-auto transition-colors">Submit</button>
                        <button type="button" onclick="app.closeModal('auth-modal')" class="mt-3 w-full inline-flex justify-center rounded-lg border border-gray-300 dark:border-gray-600 shadow-sm px-4 py-2 bg-white dark:bg-gray-700 text-sm font-bold text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600 focus:outline-none transition-colors sm:mt-0 sm:ml-3 sm:w-auto">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- EDIT REVIEW MODAL -->
    <div id="edit-modal" class="fixed inset-0 z-50 hidden" aria-labelledby="edit-title" role="dialog" aria-modal="true">
        <div class="flex items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-900/50 dark:bg-gray-950/80 transition-opacity backdrop-blur-sm" aria-hidden="true" onclick="app.closeModal('edit-modal')"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div class="inline-block align-bottom bg-white dark:bg-gray-900 rounded-2xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-md sm:w-full border border-gray-200 dark:border-gray-700">
                <form onsubmit="app.submitEdit(event)">
                    <div class="px-6 pt-6 pb-4 space-y-4">
                        <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-1">Edit Review</h3>
                        <input type="hidden" id="edit-review-id">
                        
                        <div>
                            <label for="edit-author" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Author Name</label>
                            <input type="text" id="edit-author" required class="block w-full rounded-lg border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-200 placeholder-gray-400 dark:placeholder-gray-500 border p-2.5 focus:border-indigo-500 text-sm">
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Rating</label>
                            <div class="flex items-center space-x-1" id="edit-star-selector"></div>
                        </div>

                        <div>
                            <label for="edit-seat" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Seat Number (Optional)</label>
                            <input type="text" id="edit-seat" class="block w-full rounded-lg border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-200 placeholder-gray-400 dark:placeholder-gray-500 border p-2.5 focus:border-indigo-500 text-sm">
                        </div>

                        <div>
                            <label for="edit-text" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Review Text</label>
                            <textarea id="edit-text" rows="3" required class="block w-full rounded-lg border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-200 placeholder-gray-400 dark:placeholder-gray-500 border p-2.5 focus:border-indigo-500 text-sm"></textarea>
                        </div>
                    </div>
                    <div class="bg-gray-50 dark:bg-gray-800 px-6 py-4 sm:flex sm:flex-row-reverse border-t border-gray-200 dark:border-gray-700">
                        <button type="submit" class="w-full inline-flex justify-center rounded-lg border border-transparent shadow-sm px-4 py-2.5 bg-indigo-600 text-sm font-bold text-white hover:bg-indigo-500 focus:outline-none sm:ml-3 sm:w-auto transition-colors">Save Changes</button>
                        <button type="button" onclick="app.closeModal('edit-modal')" class="mt-3 w-full inline-flex justify-center rounded-lg border border-gray-300 dark:border-gray-600 shadow-sm px-4 py-2.5 bg-white dark:bg-gray-700 text-sm font-bold text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600 focus:outline-none transition-colors sm:mt-0 sm:ml-3 sm:w-auto">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs & Application Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Import your local configuration
        import { firebaseConfig } from './firebase-config.js';
      
        const firebaseApp = initializeApp(firebaseConfig);
        const db = getFirestore(firebaseApp);

        window.app = {
            data: { cineplexes: [], reviews: [] },
            state: {
                currentTab: 'rate',
                selectedRating: 0,
                editRating: 0,
                pendingAction: null,
                isDark: true
            },

            async init() {
                if (localStorage.theme === 'light' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
                    document.documentElement.classList.remove('dark');
                    this.state.isDark = false;
                }

                const lastAuthor = localStorage.getItem('theaterTrackerAuthor');
                if (lastAuthor) document.getElementById('author-name').value = lastAuthor;

                this.renderStarSelector('star-selector', 0, 'app.setRating');
                this.switchTab('rate');
                
                this.startListeners();
            },

            toggleTheme() {
                const html = document.documentElement;
                if (html.classList.contains('dark')) {
                    html.classList.remove('dark');
                    localStorage.theme = 'light';
                    this.state.isDark = false;
                } else {
                    html.classList.add('dark');
                    localStorage.theme = 'dark';
                    this.state.isDark = true;
                }
            },

            startListeners() {
                const cineplexRef = collection(db, 'cineplexes');
                const reviewsRef = collection(db, 'reviews');

                onSnapshot(cineplexRef, (snapshot) => {
                    this.data.cineplexes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    this.populateCineplexDropdowns();
                    if(this.state.currentTab === 'rate') this.updateTheaterDatalist();
                    if(this.state.currentTab === 'browse') this.onBrowseCineplexChange();
                }, (error) => console.error("Error fetching cineplexes:", error));

                onSnapshot(reviewsRef, (snapshot) => {
                    this.data.reviews = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    this.data.reviews.sort((a, b) => new Date(b.date) - new Date(a.date));
                    this.populateAuthorDropdown();
                    if(this.state.currentTab === 'rate') this.updateTheaterDatalist();
                    if(this.state.currentTab === 'browse') this.renderBrowseList();
                }, (error) => console.error("Error fetching reviews:", error));
            },

            switchTab(tab) {
                this.state.currentTab = tab;
                document.getElementById('nav-rate').className = tab === 'rate' 
                    ? 'px-3 py-2 rounded-md text-sm font-medium transition-colors bg-indigo-600 text-white shadow-inner'
                    : 'px-3 py-2 rounded-md text-sm font-medium transition-colors text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-white cursor-pointer';
                
                document.getElementById('nav-browse').className = tab === 'browse' 
                    ? 'px-3 py-2 rounded-md text-sm font-medium transition-colors bg-indigo-600 text-white shadow-inner'
                    : 'px-3 py-2 rounded-md text-sm font-medium transition-colors text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-white cursor-pointer';

                document.getElementById('view-rate').classList.toggle('hidden', tab !== 'rate');
                document.getElementById('view-browse').classList.toggle('hidden', tab !== 'browse');

                if (tab === 'rate') this.updateTheaterDatalist();
                else if (tab === 'browse') this.onBrowseCineplexChange();
            },

            populateCineplexDropdowns() {
                const rateSelect = document.getElementById('rate-cineplex');
                const browseSelect = document.getElementById('browse-cineplex');
                let optionsHtml = '<option value="" disabled selected>Select a Cineplex...</option>';
                let browseOptionsHtml = '<option value="all">All Cineplexes</option>';
                const sorted = [...this.data.cineplexes].sort((a,b) => a.name.localeCompare(b.name));
                sorted.forEach(c => {
                    const opt = `<option value="${c.id}">${c.name}</option>`;
                    optionsHtml += opt; browseOptionsHtml += opt;
                });
                
                const currentRateVal = rateSelect.value;
                const currentBrowseVal = browseSelect.value;
                
                rateSelect.innerHTML = optionsHtml; 
                browseSelect.innerHTML = browseOptionsHtml;
                
                if (currentRateVal && sorted.some(c => c.id === currentRateVal)) rateSelect.value = currentRateVal;
                if (currentBrowseVal && (currentBrowseVal === 'all' || sorted.some(c => c.id === currentBrowseVal))) browseSelect.value = currentBrowseVal;
            },

            populateAuthorDropdown() {
                const select = document.getElementById('browse-author');
                if (!select) return;
                const currentVal = select.value;
                const authors = [...new Set(this.data.reviews.map(r => r.author).filter(Boolean))].sort(
                    (a, b) => a.toLowerCase().localeCompare(b.toLowerCase())
                );
                let html = '<option value="all">All Authors</option>';
                authors.forEach(a => html += `<option value="${a}">${a}</option>`);
                select.innerHTML = html;
                if (authors.includes(currentVal)) select.value = currentVal;
            },

            updateTheaterDatalist() {
                const cineplexId = document.getElementById('rate-cineplex').value;
                const datalist = document.getElementById('theater-suggestions');
                if (!cineplexId || cineplexId === "Loading...") { datalist.innerHTML = ''; return; }
                const theaters = [...new Set(this.data.reviews.filter(r => r.cineplexId === cineplexId).map(r => r.theaterNumber))];
                datalist.innerHTML = theaters.map(t => `<option value="${t}">`).join('');
            },

            renderStarSelector(containerId, currentRating, clickAction) {
                const container = document.getElementById(containerId);
                let html = '';
                for (let i = 1; i <= 5; i++) {
                    const isFilled = i <= currentRating;
                    const colorClass = isFilled ? 'text-amber-400' : 'text-gray-400 dark:text-gray-600 hover:text-amber-200';
                    const fillAttr = isFilled ? 'currentColor' : 'none';
                    html += `<svg onclick="${clickAction}(${i})" class="w-9 h-9 cursor-pointer transition-colors duration-150 ${colorClass}" fill="${fillAttr}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>`;
                }
                container.innerHTML = html;
            },

            setRating(val) {
                this.state.selectedRating = val;
                this.renderStarSelector('star-selector', val, 'app.setRating');
            },

            setEditRating(val) {
                this.state.editRating = val;
                this.renderStarSelector('edit-star-selector', val, 'app.setEditRating');
            },

            async submitRating(e) {
                e.preventDefault();
                
                const cineplexId = document.getElementById('rate-cineplex').value;
                const authorName = document.getElementById('author-name').value.trim();
                
                const newReview = {
                    cineplexId,
                    theaterNumber: document.getElementById('theater-number').value.trim(),
                    author: authorName,
                    seat: document.getElementById('seat-number').value.trim(),
                    rating: this.state.selectedRating,
                    text: document.getElementById('review-text').value.trim(),
                    date: new Date().toISOString()
                };

                try {
                    const docRef = doc(collection(db, 'reviews'));
                    await setDoc(docRef, newReview);
                    
                    localStorage.setItem('theaterTrackerAuthor', authorName);
                    document.getElementById('theater-number').value = '';
                    document.getElementById('seat-number').value = '';
                    document.getElementById('review-text').value = '';
                    this.setRating(0);
                    this.showNotification('Rating saved globally!', 'success');
                } catch (error) {
                    console.error("Error adding review:", error);
                    this.showNotification('Failed to save rating', 'error');
                }
            },

            async submitNewCineplex(e) {
                e.preventDefault();
                
                const newCineplex = {
                    name: document.getElementById('new-cineplex-name').value.trim(),
                    address: document.getElementById('new-cineplex-address').value.trim()
                };

                try {
                    const docRef = doc(collection(db, 'cineplexes'));
                    await setDoc(docRef, newCineplex);
                    
                    this.closeModal('add-modal');
                    e.target.reset();
                    setTimeout(() => { document.getElementById('rate-cineplex').value = docRef.id; }, 500);
                    this.showNotification('Cineplex added to database!', 'success');
                } catch (error) {
                    console.error("Error adding cineplex:", error);
                    this.showNotification('Failed to add Cineplex', 'error');
                }
            },

            onBrowseCineplexChange() {
                const cineplexId = document.getElementById('browse-cineplex').value;
                const theaterSelect = document.getElementById('browse-theater');
                
                if (!cineplexId || cineplexId === 'all') {
                    theaterSelect.innerHTML = '<option value="all">All Theaters</option>';
                    theaterSelect.disabled = true;
                } else {
                    const theaters = [...new Set(this.data.reviews.filter(r => r.cineplexId === cineplexId).map(r => r.theaterNumber))]
                        .sort((a, b) => a.localeCompare(b, undefined, {numeric: true}));
                    
                    let options = '<option value="all">All Theaters</option>';
                    theaters.forEach(t => options += `<option value="${t}">Screen ${t}</option>`);
                    
                    const currentVal = theaterSelect.value;
                    theaterSelect.innerHTML = options;
                    if (theaters.includes(currentVal)) theaterSelect.value = currentVal;
                    theaterSelect.disabled = false;
                }
                this.renderBrowseList();
            },

            renderBrowseList() {
                const container = document.getElementById('browse-content');
                const cineplexId = document.getElementById('browse-cineplex').value;
                const theaterNumber = document.getElementById('browse-theater').value;
                const authorFilter = document.getElementById('browse-author').value;

                let reviews = this.data.reviews;
                
                if (cineplexId !== 'all') reviews = reviews.filter(r => r.cineplexId === cineplexId);
                if (theaterNumber !== 'all') reviews = reviews.filter(r => r.theaterNumber === theaterNumber);
                if (authorFilter !== 'all') reviews = reviews.filter(r => r.author === authorFilter);

                if (reviews.length === 0) {
                    container.innerHTML = `<div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 p-10 text-center text-gray-500">No ratings found for these filters.</div>`;
                    return;
                }

                let html = '';
                if (cineplexId !== 'all' && authorFilter === 'all') {
                    const cineplex = this.data.cineplexes.find(c => c.id === cineplexId);
                    if (theaterNumber === 'all') {
                        const theaterStats = this.getTheaterStats(reviews);
                        html += `
                        <div class="bg-white dark:bg-gray-900 rounded-xl shadow-md border border-gray-200 dark:border-gray-800 overflow-hidden mb-6">
                            <div class="bg-gray-50 dark:bg-gray-800/50 px-5 py-3 border-b border-gray-200 dark:border-gray-800 flex justify-between items-center">
                                <div><h3 class="font-bold text-gray-900 dark:text-gray-100">${cineplex?.name} Averages</h3></div>
                                <button onclick="app.requestProtectedAction('delete', 'cineplex', '${cineplexId}')" class="text-red-500 dark:text-red-400 hover:text-red-600 dark:hover:text-red-300 text-xs font-bold px-2 py-1 bg-red-100 dark:bg-red-900/30 rounded transition-colors">Delete Cineplex</button>
                            </div>
                            <div class="p-0">
                                ${theaterStats.map(stat => `
                                    <div class="flex justify-between items-center p-4 border-b border-gray-100 dark:border-gray-800 last:border-0 hover:bg-gray-50 dark:hover:bg-gray-800/30 transition-colors">
                                        <div class="font-semibold text-gray-700 dark:text-gray-300">Screen ${stat.theater}</div>
                                        <div class="flex items-center space-x-3">
                                            <div class="text-sm font-bold text-gray-900 dark:text-gray-100">${stat.avg}</div>
                                            ${stat.avg !== 'N/A' ? this.getStaticStars(Math.round(stat.avg)) : '<span class="text-xs text-gray-400 dark:text-gray-600 italic">No ratings</span>'}
                                            <div class="text-xs text-gray-500 w-12 text-right">(${stat.count} rating${stat.count !== 1 ? 's' : ''})</div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>`;
                    } else {
                        const validReviews = reviews.filter(r => r.rating > 0);
                        const avg = validReviews.length ? (validReviews.reduce((acc, r) => acc + r.rating, 0) / validReviews.length).toFixed(1) : 'N/A';
                        html += `
                        <div class="bg-white dark:bg-gray-900 rounded-xl shadow-md border border-gray-200 dark:border-gray-800 p-5 mb-6 flex justify-between items-center">
                            <div>
                                <h3 class="font-bold text-gray-900 dark:text-gray-100 text-lg">Screen ${theaterNumber}</h3>
                                <p class="text-xs text-gray-500 dark:text-gray-400">${cineplex?.name}</p>
                                <button onclick="app.requestProtectedAction('delete', 'theater', '${cineplexId}', '${theaterNumber}')" class="text-red-500 dark:text-red-400 hover:text-red-600 dark:hover:text-red-300 text-xs font-bold mt-3 px-2 py-1 bg-red-100 dark:bg-red-900/30 rounded">Delete Theater</button>
                            </div>
                            <div class="text-right">
                                <div class="flex items-center justify-end space-x-1 mb-1">
                                    <span class="font-bold text-xl text-gray-900 dark:text-gray-100 mr-2">${avg}</span>
                                    ${avg !== 'N/A' ? this.getStaticStars(Math.round(avg)) : ''}
                                </div>
                                <p class="text-xs text-gray-500">${reviews.length} Total Reviews</p>
                            </div>
                        </div>`;
                    }
                }

                html += `<div class="bg-white dark:bg-gray-900 rounded-xl shadow-md border border-gray-200 dark:border-gray-800 overflow-hidden">`;
                html += reviews.map((review, index) => {
                    const date = new Date(review.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
                    const cplex = this.data.cineplexes.find(c => c.id === review.cineplexId);
                    return `
                        <div class="p-5 ${index !== reviews.length - 1 ? 'border-b border-gray-100 dark:border-gray-800' : ''}">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <div class="flex items-center flex-wrap gap-2">
                                        <span class="font-bold text-gray-900 dark:text-gray-100">${review.author || 'Anonymous'}</span>
                                        ${review.seat ? `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400 uppercase border border-gray-200 dark:border-gray-700">Seat ${review.seat}</span>` : ''}
                                        ${theaterNumber === 'all' ? `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 uppercase border border-indigo-100 dark:border-indigo-800/50">Screen ${review.theaterNumber}</span>` : ''}
                                        ${cineplexId === 'all' ? `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400 uppercase border border-gray-200 dark:border-gray-700 truncate max-w-[120px]" title="${cplex?.name}">${cplex?.name}</span>` : ''}
                                    </div>
                                    <div class="text-xs text-gray-500 mt-1">${date}</div>
                                </div>
                                <div class="flex flex-col items-end">
                                    <div class="flex shrink-0 ml-4">${review.rating > 0 ? this.getStaticStars(review.rating, 'w-4 h-4') : '<span class="text-xs text-gray-400 dark:text-gray-600 font-medium italic">No rating</span>'}</div>
                                    <div class="mt-2 flex space-x-2">
                                        <button onclick="app.requestProtectedAction('edit', 'review', '${review.id}')" class="text-indigo-500 dark:text-indigo-400 hover:text-indigo-600 dark:hover:text-indigo-300 text-[10px] uppercase tracking-wider font-bold">Edit</button>
                                        <button onclick="app.requestProtectedAction('delete', 'review', '${review.id}')" class="text-red-500 dark:text-red-400 hover:text-red-600 dark:hover:text-red-300 text-[10px] uppercase tracking-wider font-bold">Delete</button>
                                    </div>
                                </div>
                            </div>
                            <p class="text-gray-700 dark:text-gray-300 text-sm leading-relaxed">${review.text}</p>
                        </div>`;
                }).join('');
                html += `</div>`;
                container.innerHTML = html;
            },

            getTheaterStats(reviews) {
                const groups = {};
                reviews.forEach(r => {
                    if (!groups[r.theaterNumber]) groups[r.theaterNumber] = { total: 0, count: 0 };
                    if (r.rating > 0) { groups[r.theaterNumber].total += r.rating; groups[r.theaterNumber].count += 1; }
                });
                return Object.keys(groups).map(t => ({
                    theater: t,
                    avg: groups[t].count > 0 ? (groups[t].total / groups[t].count).toFixed(1) : 'N/A',
                    count: groups[t].count
                })).sort((a, b) => a.theater.localeCompare(b.theater, undefined, {numeric: true}));
            },

            getStaticStars(rating, sizeClass = 'w-4 h-4') {
                let html = '<div class="flex">';
                for (let i = 1; i <= 5; i++) {
                    const isFilled = i <= rating;
                    const fillAttr = isFilled ? 'currentColor' : 'none';
                    const colorClass = isFilled ? 'text-amber-400' : 'text-gray-300 dark:text-gray-700';
                    html += `<svg class="${sizeClass} ${colorClass}" fill="${fillAttr}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>`;
                }
                return html + '</div>';
            },

            requestProtectedAction(type, target, id1, id2) {
                this.state.pendingAction = { type, target, id1, id2 };
                document.getElementById('auth-password').value = '';
                this.openModal('auth-modal');
            },

            submitAuth(e) {
                e.preventDefault();
                const pwd = document.getElementById('auth-password').value;
                if (pwd === '1234') {
                    this.closeModal('auth-modal');
                    this.executePendingAction();
                } else {
                    this.showNotification('Access Denied: Incorrect Password', 'error');
                }
            },

            async executePendingAction() {
                const { type, target, id1, id2 } = this.state.pendingAction;
                
                try {
                    if (type === 'delete') {
                        if (target === 'cineplex') {
                            await deleteDoc(doc(db, 'cineplexes', id1));
                            const reviewsToDelete = this.data.reviews.filter(r => r.cineplexId === id1);
                            for (const r of reviewsToDelete) {
                                await deleteDoc(doc(db, 'reviews', r.id));
                            }
                        } else if (target === 'theater') {
                            const reviewsToDelete = this.data.reviews.filter(r => r.cineplexId === id1 && r.theaterNumber === id2);
                            for (const r of reviewsToDelete) {
                                await deleteDoc(doc(db, 'reviews', r.id));
                            }
                        } else if (target === 'review') {
                            await deleteDoc(doc(db, 'reviews', id1));
                        }
                        this.showNotification('Deleted successfully globally', 'success');
                        
                    } else if (type === 'edit' && target === 'review') {
                        const review = this.data.reviews.find(r => r.id === id1);
                        if (review) {
                            document.getElementById('edit-review-id').value = review.id;
                            document.getElementById('edit-author').value = review.author || '';
                            document.getElementById('edit-seat').value = review.seat || '';
                            document.getElementById('edit-text').value = review.text || '';
                            this.setEditRating(review.rating || 0);
                            this.openModal('edit-modal');
                        }
                    }
                } catch (error) {
                    console.error("Error executing action:", error);
                    this.showNotification("Action failed", 'error');
                }
                
                this.state.pendingAction = null;
            },

            async submitEdit(e) {
                e.preventDefault();
                
                const id = document.getElementById('edit-review-id').value;
                const updateData = {
                    author: document.getElementById('edit-author').value.trim(),
                    seat: document.getElementById('edit-seat').value.trim(),
                    text: document.getElementById('edit-text').value.trim(),
                    rating: this.state.editRating
                };
                
                try {
                    const docRef = doc(db, 'reviews', id);
                    await updateDoc(docRef, updateData);
                    
                    this.showNotification('Review updated globally', 'success');
                    this.closeModal('edit-modal');
                } catch (error) {
                    console.error("Error updating review:", error);
                    this.showNotification("Failed to update review", "error");
                }
            },

            openModal(id) { document.getElementById(id).classList.remove('hidden'); },
            closeModal(id) { document.getElementById(id).classList.add('hidden'); },

            showNotification(msg, type = 'success') {
                const notif = document.getElementById('notification');
                notif.textContent = msg;
                notif.className = `fixed top-20 left-1/2 transform -translate-x-1/2 z-50 px-5 py-3 rounded-lg shadow-xl text-sm font-bold text-white transition-all duration-300 ${type === 'success' ? 'bg-emerald-600' : 'bg-red-600'}`;
                notif.classList.remove('hidden', 'opacity-0', '-translate-y-4');
                setTimeout(() => {
                    notif.classList.add('opacity-0', '-translate-y-4');
                    setTimeout(() => notif.classList.add('hidden'), 300);
                }, 3000);
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
